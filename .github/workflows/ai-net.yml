name: AI experimental build
on:
  push:
    branches: [ai-net-experiment]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Fetch AI and author library
        shell: pwsh
        run: |
          git clone https://github.com/click3/th123_ai.git ai
          git -C ai checkout 4cd9d204f353dd10d3c483dcea1b429d341171de
          git clone https://github.com/click3/org-click3.git author-lib
          git -C author-lib checkout f704dbc6bf8e8fb5bbfc36b4cb9a20c5798128f1
          python ai-net-patch.py
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
          toolset: 14.29
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/cache@v4
        id: boost
        with:
          path: boost_1_71_0
          key: soku-boost-1.71-msvc142-x86-v3
      - name: Build Boost 1.71
        if: steps.boost.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          curl.exe -fL --retry 3 https://archives.boost.io/release/1.71.0/source/boost_1_71_0.7z -o boost.7z
          if errorlevel 1 exit /b 1
          7z x boost.7z -y > nul
          if errorlevel 1 exit /b 1
          cd boost_1_71_0
          call bootstrap.bat msvc
          if errorlevel 1 (type bootstrap.log & exit /b 1)
          echo using msvc : 14.2 : cl.exe ; > project-config.jam
          b2.exe --with-filesystem --with-system --with-program_options toolset=msvc-14.2 address-model=32 variant=release link=static runtime-link=static threading=multi stage -j 2
          if errorlevel 1 exit /b 1
      - name: Build author libraries
        shell: cmd
        run: |
          mkdir author-build
          cl /nologo /c /O2 /MT /EHsc /Iboost_1_71_0 /Iauthor-lib /Foauthor-build\utility.obj author-lib\org\click3\utility.cpp
          if errorlevel 1 exit /b 1
          lib /nologo /out:author-build\utility_release_static.lib author-build\utility.obj
          if errorlevel 1 exit /b 1
          cl /nologo /c /O2 /MT /EHsc /Iboost_1_71_0 /Iauthor-lib /Foauthor-build\dll_hack_lib.obj author-lib\org\click3\dll_hack_lib.cpp
          if errorlevel 1 exit /b 1
          lib /nologo /out:author-build\dll_hack_lib_release_static.lib author-build\dll_hack_lib.obj
          if errorlevel 1 exit /b 1
      - name: Build x86
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          @"
          <Project><PropertyGroup><IncludePath>$root\boost_1_71_0;$root\author-lib;`$(IncludePath)</IncludePath><LibraryPath>$root\boost_1_71_0\stage\lib;$root\author-build;`$(LibraryPath)</LibraryPath></PropertyGroup></Project>
          "@ | Set-Content ai/Directory.Build.props
          '<Project><ItemDefinitionGroup><ClCompile><RuntimeLibrary>MultiThreaded</RuntimeLibrary></ClCompile></ItemDefinitionGroup></Project>' | Set-Content ai/Directory.Build.targets
          msbuild ai/th123_ai.sln /t:th123_ai /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v142 /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: ai-net-experimental
          path: ai/Release/th123_ai.exe
          if-no-files-found: error



